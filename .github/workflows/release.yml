name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  BIN_NAME: vulnbell
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Require a matching tag and crate version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Release tag must look like vX.Y.Z; got ${RELEASE_TAG}" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "Checked-out commit does not match ${RELEASE_TAG}" >&2
            exit 1
          fi
          pkgid="$(cargo pkgid)"
          manifest_version="${pkgid##*#}"
          manifest_version="${manifest_version##*@}"
          if [ "$manifest_version" != "${RELEASE_TAG#v}" ]; then
            echo "Tag ${RELEASE_TAG} does not match Cargo.toml version ${manifest_version}" >&2
            exit 1
          fi
      - name: Run release tests
        env:
          CARGO_TERM_COLOR: never
        run: cargo test --all-targets --locked

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Test release target
        env:
          CARGO_TERM_COLOR: never
        run: cargo test --release --all-targets --locked --target ${{ matrix.target }}
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          asset_dir="${BIN_NAME}-${TARGET}-v${version}"
          mkdir -p "dist/${asset_dir}/skills"
          cp "target/${TARGET}/release/${BIN_NAME}" "dist/${asset_dir}/"
          cp -R skills/vulnbell "dist/${asset_dir}/skills/"
          cp README.md CHANGELOG.md LICENSE SECURITY.md CONTRIBUTING.md "dist/${asset_dir}/"
          cp -R docs examples schemas "dist/${asset_dir}/"
          tar -C dist -czf "dist/${asset_dir}.tgz" "${asset_dir}"
          rm -rf "dist/${asset_dir}"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $assetDir = "$env:BIN_NAME-$env:TARGET-v$version"
          New-Item -ItemType Directory -Path "dist\$assetDir\skills" -Force
          Copy-Item "target\$env:TARGET\release\$env:BIN_NAME.exe" "dist\$assetDir\"
          Copy-Item "skills\vulnbell" "dist\$assetDir\skills\" -Recurse
          Copy-Item README.md, CHANGELOG.md, LICENSE, SECURITY.md, CONTRIBUTING.md "dist\$assetDir\"
          Copy-Item "docs" "dist\$assetDir\" -Recurse
          Copy-Item "examples" "dist\$assetDir\" -Recurse
          Copy-Item "schemas" "dist\$assetDir\" -Recurse
          Compress-Archive -Path "dist\$assetDir" -DestinationPath "dist\$assetDir.zip" -Force
          Remove-Item "dist\$assetDir" -Recurse -Force
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -- * > SHA256SUMS
      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes
          fi
